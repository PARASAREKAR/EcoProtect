name: EcoProtect CI & Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Test, Verify & Run Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (Unit & Integration)
        run: |
          python -m unittest tests/test_app.py -v

      - name: Run Live Flask Server and Verify HTTP Endpoints
        run: |
          echo "Starting Flask web application in background..."
          python app.py &
          SERVER_PID=$!
          
          # Wait up to 15 seconds for the server to be ready
          echo "Waiting for live HTTP response..."
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:5000/ > /dev/null; then
              echo "Server successfully reachable on port 5000!"
              break
            fi
            sleep 1
          done

          echo "Verifying Home page..."
          curl -I -f http://127.0.0.1:5000/

          echo "Verifying 3D Globe Observation Center..."
          curl -I -f http://127.0.0.1:5000/globe

          echo "Verifying Crisis Hazards REST API..."
          curl -s -f http://127.0.0.1:5000/api/hazard/1 | grep -q "deaths"
          echo "Crisis API verified successfully!"

          echo "Verifying Three.js and Static Datasets..."
          curl -I -f http://127.0.0.1:5000/static/js/three.min.js
          curl -I -f http://127.0.0.1:5000/static/data/hazards_core.json

          echo "Gracefully terminating test runner process (PID: $SERVER_PID)..."
          kill $SERVER_PID || true
          echo "GitHub Actions CI verification complete: All tests passed!"
